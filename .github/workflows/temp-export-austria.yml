name: Temporary Austria HTML Export
on:
  pull_request:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Upload HTML to temporary file service
        run: |
          URL=$(curl -fsSL https://raw.githubusercontent.com/Snirni/hello-world/main/tmp/Austria_2026_Yehezkel_Nisim_FINAL.html | curl -fsS --data-binary @- https://paste.rs)
          echo "DIRECT_URL=$URL"
