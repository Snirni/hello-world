name: Temporary Austria HTML Export
on:
  pull_request:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload HTML to temporary file service
        run: |
          URL=$(curl -fsS --data-binary @tmp/Austria_2026_Yehezkel_Nisim_FINAL.html https://paste.rs)
          echo "DIRECT_URL=$URL"
