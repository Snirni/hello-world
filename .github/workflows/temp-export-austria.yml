name: Temporary Austria HTML Export
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Publish direct HTML download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://paste.rs/SixHr -o Austria_2026_Yehezkel_Nisim_FINAL.html
          gh release delete austria-2026-final --repo Snirni/hello-world --cleanup-tag -y || true
          gh release create austria-2026-final Austria_2026_Yehezkel_Nisim_FINAL.html --repo Snirni/hello-world --title "Austria 2026 Yehezkel-Nisim" --notes "Final family itinerary HTML"
          echo "DIRECT_DOWNLOAD=https://github.com/Snirni/hello-world/releases/download/austria-2026-final/Austria_2026_Yehezkel_Nisim_FINAL.html"
